<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta
			name="viewport"
			content="width=device-width, user-scalable=no, initial-scale=1.0"
		>

		<title>DearMail</title>

		<style>

			/* =========================================================
			   FULL TRANSPARENT PAGE
			========================================================= */

			html,
			body {
				width: 100%;
				height: 100%;

				margin: 0;
				padding: 0;
				border: 0;

				background: transparent !important;
				background-color: transparent !important;

				overflow: hidden;
			}


			body {
				color: white;

				touch-action: none;

				/*
					Prevents the browser from creating
					unwanted spacing around the canvas.
				*/
				position: fixed;
				inset: 0;
			}


			/* =========================================================
			   GODOT CANVAS
			========================================================= */

			#canvas {
				position: fixed;

				top: 0;
				left: 0;

				width: 100vw;
				height: 100vh;

				margin: 0;
				padding: 0;
				border: 0;

				display: block;

				background: transparent !important;
				outline: none;

				/*
					Prevents sub-pixel positioning
					from creating a visible edge.
				*/
				transform: translate3d(0, 0, 0);
			}


			#canvas:focus {
				outline: none;
			}


			/* =========================================================
			   STATUS / LOADING OVERLAY
			========================================================= */

			#status,
			#status-splash,
			#status-progress,
			#status-notice {
				position: absolute;

				left: 0;
				right: 0;
			}


			#status,
			#status-splash {
				top: 0;
				bottom: 0;
			}


			#status {
				background: transparent !important;
				background-color: transparent !important;

				display: flex;

				flex-direction: column;
				justify-content: center;
				align-items: center;

				visibility: hidden;

				pointer-events: none;
			}


			/* =========================================================
			   SPLASH IMAGE
			========================================================= */

			#status-splash {
				max-height: 100%;
				max-width: 100%;

				margin: auto;

				background: transparent !important;
			}


			#status-splash.show-image--false {
				display: none;
			}


			#status-splash.fullsize--true {
				height: 100%;
				width: 100%;

				object-fit: contain;
			}


			#status-splash.use-filter--false {
				image-rendering: pixelated;
			}


			/* =========================================================
			   LOADING BAR
			========================================================= */

			#status-progress {
				bottom: 10%;

				width: 50%;

				margin: 0 auto;

				background: transparent !important;
			}


			#status-progress,
			#status-notice {
				display: none;
			}


			/* =========================================================
			   ERROR NOTICE
			========================================================= */

			#status-notice {
				background: transparent !important;
				background-color: transparent !important;

				border: none;
				border-radius: 0;

				color: white;

				font-family:
					'Noto Sans',
					'Droid Sans',
					Arial,
					sans-serif;

				line-height: 1.3;

				margin: 0 2rem;

				overflow: hidden;

				padding: 1rem;

				text-align: center;

				z-index: 1;
			}

		</style>
	</head>


	<body>

		<!-- =========================================================
		     GODOT CANVAS
		========================================================= -->

		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>


		<!-- =========================================================
		     NOSCRIPT
		========================================================= -->

		<noscript>
			Your browser does not support JavaScript.
		</noscript>


		<!-- =========================================================
		     STATUS / LOADING SCREEN
		========================================================= -->

		<div id="status">

			<img
				id="status-splash"
				class="show-image--false fullsize--true use-filter--true"
				src="Dearmail.png"
				alt=""
			>

			<progress
				id="status-progress"
			></progress>

			<div id="status-notice"></div>

		</div>


		<!-- =========================================================
		     GODOT ENGINE
		========================================================= -->

		<script src="Dearmail.js"></script>


		<script>

			const GODOT_CONFIG = {

				"args": [],

				/*
					1 = canvas follows the page size.

					This helps prevent the tiny vertical
					edge caused by canvas resizing.
				*/
				"canvasResizePolicy": 1,

				"emscriptenPoolSize": 8,

				"ensureCrossOriginIsolationHeaders": true,

				"executable": "Dearmail",

				"experimentalVK": false,

				"fileSizes": {
					"Dearmail.pck": 384020,
					"Dearmail.wasm": 37695054
				},

				"focusCanvas": false,

				"gdextensionLibs": [],

				"godotPoolSize": 4
			};


			const GODOT_THREADS_ENABLED = false;


			const engine = new Engine(GODOT_CONFIG);


			/* =========================================================
			   STATUS SYSTEM
			========================================================= */

			(function () {

				const statusOverlay =
					document.getElementById('status');

				const statusProgress =
					document.getElementById('status-progress');

				const statusNotice =
					document.getElementById('status-notice');


				let initializing = true;

				let statusMode = '';


				/* =====================================================
				   SET STATUS MODE
				===================================================== */

				function setStatusMode(mode) {

					if (
						statusMode === mode ||
						!initializing
					) {
						return;
					}


					if (mode === 'hidden') {

						statusOverlay.remove();

						initializing = false;

						return;
					}


					statusOverlay.style.visibility =
						'visible';


					statusProgress.style.display =
						mode === 'progress'
							? 'block'
							: 'none';


					statusNotice.style.display =
						mode === 'notice'
							? 'block'
							: 'none';


					statusMode = mode;
				}


				/* =====================================================
				   STATUS NOTICE
				===================================================== */

				function setStatusNotice(text) {

					while (
						statusNotice.lastChild
					) {
						statusNotice.removeChild(
							statusNotice.lastChild
						);
					}


					const lines =
						text.split('\n');


					lines.forEach((line) => {

						statusNotice.appendChild(
							document.createTextNode(line)
						);


						statusNotice.appendChild(
							document.createElement('br')
						);

					});
				}


				/* =====================================================
				   FAILURE NOTICE
				===================================================== */

				function displayFailureNotice(err) {

					console.error(err);


					if (err instanceof Error) {

						setStatusNotice(
							err.message
						);

					} else if (
						typeof err === 'string'
					) {

						setStatusNotice(err);

					} else {

						setStatusNotice(
							'An unknown error occurred.'
						);

					}


					setStatusMode('notice');


					initializing = false;
				}


				/* =====================================================
				   CHECK REQUIRED FEATURES
				===================================================== */

				const missing =
					Engine.getMissingFeatures({
						threads:
							GODOT_THREADS_ENABLED,
					});


				/* =====================================================
				   MISSING FEATURES
				===================================================== */

				if (missing.length !== 0) {

					if (
						GODOT_CONFIG['serviceWorker'] &&
						GODOT_CONFIG[
							'ensureCrossOriginIsolationHeaders'
						] &&
						'serviceWorker' in navigator
					) {

						let
							serviceWorkerRegistrationPromise;


						try {

							serviceWorkerRegistrationPromise =
								navigator
									.serviceWorker
									.getRegistration();

						} catch (err) {

							serviceWorkerRegistrationPromise =
								Promise.reject(
									new Error(
										'Service worker registration failed.'
									)
								);

						}


						Promise.race([

							serviceWorkerRegistrationPromise
								.then(
									(registration) => {

										if (
											registration != null
										) {

											return Promise.reject(
												new Error(
													'Service worker already exists.'
												)
											);

										}


										return registration;
									}
								)
								.then(() =>
									engine.installServiceWorker()
								),


							/*
								For some reason,
								getRegistration() can stall.
							*/

							new Promise((resolve) => {

								setTimeout(
									() => resolve(),
									2000
								);

							}),

						])
						.then(() => {

							window.location.reload();

						})
						.catch((err) => {

							console.error(
								'Error while registering service worker:',
								err
							);

						});


					} else {

						const missingMsg =
							'Error\nThe following features required to run Godot projects on the Web are missing:\n';


						displayFailureNotice(
							missingMsg +
							missing.join('\n')
						);

					}


				} else {

					/* =================================================
					   START GAME
					================================================= */

					setStatusMode('progress');


					engine.startGame({

						'onProgress':
							function (current, total) {

								if (
									current > 0 &&
									total > 0
								) {

									statusProgress.value =
										current;

									statusProgress.max =
										total;

								} else {

									statusProgress
										.removeAttribute(
											'value'
										);

									statusProgress
										.removeAttribute(
											'max'
										);

								}

							},

					})
					.then(() => {

						/*
							Remove the entire status
							overlay once Godot loads.
						*/

						setStatusMode('hidden');

					}, displayFailureNotice);

				}

			}());

		</script>

	</body>
</html>
