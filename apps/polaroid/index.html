<!DOCTYPE html>
<html lang="en">
<head>

	<meta charset="utf-8">

	<meta
		name="viewport"
		content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
	>

	<title>ShakePolaroid</title>

	<style>

		/* =========================================================
		   FULL PAGE
		========================================================= */

		html,
		body {
			margin: 0;
			padding: 0;

			width: 100%;
			height: 100%;

			min-width: 100%;
			min-height: 100%;

			overflow: hidden;

			border: 0;

			background: #D39DB6;
		}

		body {
			position: fixed;

			left: 0;
			top: 0;
			right: 0;
			bottom: 0;

			color: white;

			touch-action: none;

			-webkit-user-select: none;
			user-select: none;
		}


		/* =========================================================
		   GODOT CANVAS
		========================================================= */

		#canvas {
			position: fixed;

			left: 0;
			top: 0;

			display: block;

			width: 100vw !important;
			height: 100vh !important;

			width: 100dvw !important;
			height: 100dvh !important;

			margin: 0;
			padding: 0;

			border: 0;

			outline: none;

			background: transparent;

			touch-action: none;
		}

		#canvas:focus {
			outline: none;
		}


		/* =========================================================
		   LOADING SCREEN
		========================================================= */

		#status {
			position: fixed;

			inset: 0;

			width: 100vw;
			height: 100vh;

			width: 100dvw;
			height: 100dvh;

			margin: 0;
			padding: 0;

			box-sizing: border-box;

			background: #D39DB6;

			display: flex;

			flex-direction: column;

			justify-content: center;
			align-items: center;

			visibility: hidden;

			z-index: 9999;

			overflow: hidden;
		}


		/* =========================================================
		   LOADING IMAGE
		========================================================= */

		#status-splash {
			display: block;

			width: auto;
			height: auto;

			max-width: 80vw;
			max-height: 65vh;

			margin: 0 auto;

			object-fit: contain;
		}

		#status-splash.show-image--false {
			display: none;
		}

		#status-splash.fullsize--true {
			width: auto;
			height: auto;

			max-width: 80vw;
			max-height: 65vh;

			object-fit: contain;
		}

		#status-splash.use-filter--false {
			image-rendering: pixelated;
		}


		/* =========================================================
		   LOADING PROGRESS BAR
		========================================================= */

		#status-progress {
			position: absolute;

			left: 50%;
			bottom: 8%;

			transform: translateX(-50%);

			width: min(400px, 65vw);
			height: 8px;

			margin: 0;

			appearance: none;
			-webkit-appearance: none;

			border: none;

			border-radius: 999px;

			background: rgba(255, 255, 255, 0.35);

			overflow: hidden;
		}

		#status-progress::-webkit-progress-bar {
			background: rgba(255, 255, 255, 0.35);
			border-radius: 999px;
		}

		#status-progress::-webkit-progress-value {
			background: #ffffff;
			border-radius: 999px;
		}

		#status-progress::-moz-progress-bar {
			background: #ffffff;
			border-radius: 999px;
		}


		/* =========================================================
		   ERROR NOTICE
		========================================================= */

		#status-notice {
			position: absolute;

			left: 50%;
			top: 50%;

			transform: translate(-50%, -50%);

			width: min(500px, calc(100vw - 40px));

			box-sizing: border-box;

			background: rgba(91, 57, 67, 0.94);

			border-radius: 14px;

			border: 1px solid rgba(255, 255, 255, 0.25);

			color: white;

			font-family:
				'Noto Sans',
				'Droid Sans',
				Arial,
				sans-serif;

			font-size: 15px;

			line-height: 1.4;

			padding: 18px;

			text-align: center;

			z-index: 10000;

			display: none;

			overflow-wrap: break-word;
		}


		/* =========================================================
		   TABLET / MOBILE
		========================================================= */

		@media (max-width: 768px) {

			#canvas {
				width: 100vw !important;
				height: 100vh !important;

				width: 100dvw !important;
				height: 100dvh !important;
			}

			#status {
				width: 100vw;
				height: 100vh;

				width: 100dvw;
				height: 100dvh;
			}

			#status-splash {
				max-width: 82vw;
				max-height: 60vh;
			}

			#status-progress {
				width: 65vw;
				height: 7px;
				bottom: 7%;
			}
		}


		/* =========================================================
		   SMALL PHONES
		========================================================= */

		@media (max-width: 480px) {

			#status-splash {
				max-width: 78vw;
				max-height: 55vh;
			}

			#status-progress {
				width: 70vw;
			}
		}


		/* =========================================================
		   LANDSCAPE MOBILE
		========================================================= */

		@media (orientation: landscape) and (max-height: 600px) {

			#status-splash {
				max-width: 55vw;
				max-height: 55vh;
			}

			#status-progress {
				bottom: 5%;
			}
		}

	</style>


	<link
		id="-gd-engine-icon"
		rel="icon"
		type="image/png"
		href="index.icon.png"
	>

	<link
		rel="apple-touch-icon"
		href="index.apple-touch-icon.png"
	>

</head>


<body>


	<canvas id="canvas">
		Your browser does not support the canvas tag.
	</canvas>


	<noscript>
		Your browser does not support JavaScript.
	</noscript>


	<!-- =========================================================
	     LOADING SCREEN
	========================================================= -->

	<div id="status">

		<img
			id="status-splash"
			class="show-image--false fullsize--true use-filter--true"
			src="index.png"
			alt=""
		>

		<progress id="status-progress"></progress>

		<div id="status-notice"></div>

	</div>


	<script src="index.js"></script>


	<script>

		/* =========================================================
		   GODOT CONFIG
		========================================================= */

		const GODOT_CONFIG = {
			"args": [],
			"canvasResizePolicy": 2,
			"emscriptenPoolSize": 8,
			"ensureCrossOriginIsolationHeaders": true,
			"executable": "index",
			"experimentalVK": false,
			"fileSizes": {
				"index.pck": 1868520,
				"index.wasm": 37695054
			},
			"focusCanvas": true,
			"gdextensionLibs": [],
			"godotPoolSize": 4
		};


		const GODOT_THREADS_ENABLED = false;


		/* =========================================================
		   FORCE CANVAS TO BROWSER SIZE
		========================================================= */

		function resizeCanvas() {

			const canvas =
				document.getElementById("canvas");

			const width =
				window.innerWidth;

			const height =
				window.innerHeight;


			canvas.style.width =
				width + "px";

			canvas.style.height =
				height + "px";


			canvas.width =
				width;

			canvas.height =
				height;
		}


		/* Initial resize */
		resizeCanvas();


		/* Browser resize */
		window.addEventListener(
			"resize",
			resizeCanvas
		);


		/* Orientation change */
		window.addEventListener(
			"orientationchange",
			function () {

				setTimeout(
					resizeCanvas,
					100
				);

			}
		);


		/* =========================================================
		   GODOT ENGINE
		========================================================= */

		const engine =
			new Engine(GODOT_CONFIG);


		/* =========================================================
		   LOADING SYSTEM
		========================================================= */

		(function () {

			const statusOverlay =
				document.getElementById("status");

			const statusProgress =
				document.getElementById("status-progress");

			const statusNotice =
				document.getElementById("status-notice");


			let initializing = true;

			let statusMode = "";


			/* =====================================================
			   CHANGE STATUS
			===================================================== */

			function setStatusMode(mode) {

				if (
					statusMode === mode ||
					!initializing
				) {
					return;
				}


				/* =============================================
				   HIDE LOADING SCREEN
				============================================= */

				if (mode === "hidden") {

					statusOverlay.remove();

					initializing = false;

					return;
				}


				/* =============================================
				   SHOW LOADING SCREEN
				============================================= */

				statusOverlay.style.visibility =
					"visible";


				statusProgress.style.display =
					mode === "progress"
						? "block"
						: "none";


				statusNotice.style.display =
					mode === "notice"
						? "block"
						: "none";


				statusMode = mode;
			}


			/* =====================================================
			   STATUS NOTICE
			===================================================== */

			function setStatusNotice(text) {

				while (
					statusNotice.lastChild
				) {

					statusNotice.removeChild(
						statusNotice.lastChild
					);
				}


				const lines =
					text.split("\n");


				lines.forEach(function (line) {

					statusNotice.appendChild(
						document.createTextNode(line)
					);

					statusNotice.appendChild(
						document.createElement("br")
					);

				});
			}


			/* =====================================================
			   FAILURE
			===================================================== */

			function displayFailureNotice(err) {

				console.error(err);


				if (
					err instanceof Error
				) {

					setStatusNotice(
						err.message
					);

				}

				else if (
					typeof err === "string"
				) {

					setStatusNotice(
						err
					);

				}

				else {

					setStatusNotice(
						"An unknown error occurred."
					);

				}


				setStatusMode("notice");

				initializing = false;
			}


			/* =====================================================
			   CHECK FEATURES
			===================================================== */

			const missing =
				Engine.getMissingFeatures({
					threads:
						GODOT_THREADS_ENABLED
				});


			if (missing.length !== 0) {

				if (
					GODOT_CONFIG["serviceWorker"] &&
					GODOT_CONFIG[
						"ensureCrossOriginIsolationHeaders"
					] &&
					"serviceWorker" in navigator
				) {

					let serviceWorkerRegistrationPromise;


					try {

						serviceWorkerRegistrationPromise =
							navigator
								.serviceWorker
								.getRegistration();

					}

					catch (err) {

						serviceWorkerRegistrationPromise =
							Promise.reject(
								new Error(
									"Service worker registration failed."
								)
							);
					}


					Promise.race([

						serviceWorkerRegistrationPromise
							.then(function (registration) {

								if (registration != null) {

									return Promise.reject(
										new Error(
											"Service worker already exists."
										)
									);

								}

								return registration;
							})
							.then(function () {

								return engine.installServiceWorker();

							}),


						new Promise(function (resolve) {

							setTimeout(
								function () {
									resolve();
								},
								2000
							);

						})

					])
					.then(function () {

						window.location.reload();

					})
					.catch(function (err) {

						console.error(
							"Error while registering service worker:",
							err
						);

					});


				} else {

					const missingMsg =
						"Error\n" +
						"The following features required to run Godot projects on the Web are missing:\n";


					displayFailureNotice(
						missingMsg +
						missing.join("\n")
					);
				}


			} else {

				/* =============================================
				   START GAME
				============================================= */

				setStatusMode("progress");


				engine.startGame({

					"onProgress":
						function (current, total) {

							if (
								current > 0 &&
								total > 0
							) {

								statusProgress.value =
									current;

								statusProgress.max =
									total;

							} else {

								statusProgress.removeAttribute(
									"value"
								);

								statusProgress.removeAttribute(
									"max"
								);

							}
						}

				})
				.then(function () {

					setStatusMode("hidden");

				}, displayFailureNotice);

			}

		})();

	</script>


</body>
</html>
