<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>theshartechclub's bubblegum</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Offside&display=swap" rel="stylesheet">

<style>

/* =========================================================
   RESET
========================================================= */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    background-color: #ffd1e1;
    background-image: repeating-linear-gradient(
        90deg,
        #ffd1e1 0px,
        #ffd1e1 6px,
        #fffafc 6px,
        #fffafc 12px
    );
    font-family: "Offside", sans-serif;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    color: #F87670;
}

/* =========================================================
   APP
========================================================= */

#app {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
}

/* =========================================================
   BACKGROUND BUBBLES
========================================================= */

#backgroundBubbles {
    display: none;
    position: fixed;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
    z-index: 0;
}

.bg-bubble {
    position: absolute;
    border-radius: 50%;

    /* stronger color visibility */
    opacity: .90;

    background:
        radial-gradient(
            circle at 30% 25%,
            rgba(255,255,255,.95) 0%,
            color-mix(in srgb, var(--bubble-color) 75%, white) 28%,
            color-mix(in srgb, var(--bubble-color) 55%, transparent) 62%,
            color-mix(in srgb, var(--bubble-color) 30%, transparent) 78%,
            transparent 82%
        );

    border:
        1.5px solid color-mix(
            in srgb,
            var(--bubble-color) 65%,
            white
        );

    box-shadow:
        inset 4px 5px 8px rgba(255,255,255,.55),
        inset -5px -6px 10px color-mix(
            in srgb,
            var(--bubble-color) 18%,
            transparent
        ),
        0 8px 18px rgba(130,90,80,.08);

    animation:
        bgFloat var(--duration) ease-in-out var(--delay) infinite alternate;
}

@keyframes bgFloat {

    0% {
        transform:
            translate3d(0,0,0)
            rotate(0deg);
    }

    50% {
        transform:
            translate3d(
                var(--move-x),
                var(--move-y),
                0
            )
            rotate(8deg);
    }

    100% {
        transform:
            translate3d(
                calc(var(--move-x) * -.6),
                calc(var(--move-y) * -.7),
                0
            )
            rotate(-8deg);
    }
}

.bg-pop {
    position: fixed;

    width: 8px;
    height: 8px;

    margin-left: -4px;
    margin-top: -4px;

    border-radius: 50%;

    border: 2px solid rgba(248,118,112,.7);

    animation: bgPop .5s ease-out forwards;

    pointer-events: none;
}

@keyframes bgPop {

    0% {
        transform: scale(.2);
        opacity: 1;
        box-shadow:
            0 0 0 0 rgba(248,118,112,.45);
    }

    100% {
        transform: scale(8);
        opacity: 0;
        box-shadow:
            0 0 0 10px rgba(248,118,112,0);
    }
}

/* =========================================================
   TITLE
========================================================= */

#titleArea {
    position: absolute;

    left: 50%;
    top: 18px;

    transform: translateX(-50%);

    z-index: 100;

    pointer-events: none;
}

#siteTitle{
    font-family:"Offside",sans-serif;

    font-size:clamp(15px,2vw,22px);
    font-weight:400;
    letter-spacing:.6px;

    color:#000;

    background:#ffd9ea;
    padding:10px 18px;


    white-space:nowrap;
    text-align:center;
}

.title-letter {
    position: relative;
    display: inline-block;

    color: #000;

    animation:
        titleFloat 3.5s ease-in-out infinite;
}

.title-letter:nth-child(2) {
    animation-delay: -.2s;
}

.title-letter:nth-child(3) {
    animation-delay: -.4s;
}

.title-letter:nth-child(4) {
    animation-delay: -.6s;
}

.title-letter:nth-child(5) {
    animation-delay: -.8s;
}

.title-letter:nth-child(6) {
    animation-delay: -1s;
}

.title-letter:nth-child(7) {
    animation-delay: -1.2s;
}

.title-letter:nth-child(8) {
    animation-delay: -1.4s;
}

.title-letter:nth-child(9) {
    animation-delay: -1.6s;
}

.title-letter:nth-child(10) {
    animation-delay: -1.8s;
}

@keyframes titleFloat {

    0%,
    100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-3px);
    }
}

.title-letter.bubble-letter::before {

    content: "";

    position: absolute;

    width: 18px;
    height: 18px;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%);

    border-radius: 50%;

    background:
        radial-gradient(
            circle at 30% 25%,
            rgba(255,255,255,.95),
            rgba(248,118,112,.65) 35%,
            rgba(248,118,112,.22) 70%
        );

    border:
        1px solid rgba(248,118,112,.85);

    z-index: -1;

    opacity: .85;

    animation:
        letterBubble 3.5s ease-in-out infinite;
}

@keyframes letterBubble {

    0%,
    100% {
        transform:
            translate(-50%, -50%)
            scale(.9);
    }

    50% {
        transform:
            translate(-50%, -50%)
            scale(1.15);
    }
}

/* =========================================================
   SHELF AREA
========================================================= */

#shelfArea {

    position: absolute;

    top: 82px;
    left: 50%;

    transform:
        translateX(-50%);

    width:
        min(770px, 84vw);

    z-index: 80;
}

/* =========================================================
   GLASS CABINET
========================================================= */

#gumCabinet {

    position: relative;

    width: 100%;
    height: 125px;

    border-radius: 18px;

    background:
        linear-gradient(
            180deg,
            rgba(255,255,255,.36),
            rgba(255,255,255,.12)
        );

    border:
        3px solid rgba(255,255,255,.72);

    box-shadow:
        0 14px 35px rgba(120,80,70,.18),
        inset 0 2px 8px rgba(255,255,255,.65);

    overflow: hidden;

    cursor: pointer;

    transition:
        transform .15s ease;
}

#gumCabinet:active {
    transform: scale(.985);
}

/* =========================================================
   CABINET TOP
========================================================= */

.cabinet-top {

    position: absolute;

    left: 8px;
    right: 8px;

    top: 5px;

    height: 9px;

    border-radius: 10px;

    background:
        linear-gradient(
            90deg,
            rgba(255,255,255,.75),
            rgba(248,118,112,.12),
            rgba(255,255,255,.75)
        );

    pointer-events: none;

    z-index: 50;
}

/* =========================================================
   GUM SHELF
========================================================= */

#gumShelf {

    position: absolute;

    left: 18px;
    right: 18px;

    bottom: 13px;

    height: 83px;

    display: flex;

    align-items: center;
    justify-content: center;

    gap: 13px;

    z-index: 8;
}

/* =========================================================
   BUBBLEGUM PACKAGING
========================================================= */

.gum-pack{
    position:relative;
    width:92px;
    height:72px;
    flex:0 0 92px;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:transform .2s ease;
}

.gum-pack::before{
    content:"";
    position:absolute;
    inset:0;
    border-radius:8px;
    background:var(--pack-color);
    border:3px solid rgba(255,255,255,.9);
    box-shadow:0 4px 10px rgba(100,70,60,.12);
}

.gum-pack::after{
    content:"";
    position:absolute;
    top:0;
    bottom:0;
    left:0;
    width:12px;

    background:
    repeating-linear-gradient(
        45deg,
        rgba(255,255,255,.35) 0px,
        rgba(255,255,255,.35) 4px,
        transparent 4px,
        transparent 8px
    );

    border-radius:6px 0 0 6px;
}

/* hide brand text */
.pack-brand{
    display:none;
}

/* remove gum circle completely */
.pack-gum{
    display:none;
}

.gum{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    opacity:0;
    cursor:pointer;
    z-index:10;
}

.gum::before,
.gum::after{
    display:none !important;
    content:none !important;
}

.pack-fruit{
    position:absolute;
    top:6px;
    left:50%;
    transform:translateX(-50%);

    width:52px;
    height:38px;

    display:flex;
    align-items:center;
    justify-content:center;

    z-index:5;
    pointer-events:none;
}

.pack-fruit img{
    width:100%;
    height:100%;
    object-fit:contain;
    display:block;
}

.pack-label{
    position:absolute;
    left:4px;
    right:4px;
    bottom:12px;

    display:flex;
    justify-content:center;
    align-items:center;

    text-align:center;

    font-size:12px;
    font-weight:700;
    letter-spacing:.5px;
    line-height:1;

    color:#fff;
    z-index:5;

    text-shadow:
        0 1px 2px rgba(0,0,0,.25);
}

.gum-pack:hover{
    transform:translateY(-4px);
}

/* =========================================================
   GUM BUTTONS
========================================================= */

.gum {

    position: relative;

    width: 78px;
    height: 70px;

    border: 0;

    background: transparent;

    cursor: pointer;

    display: flex;

    align-items: center;
    justify-content: center;

    transition:
        transform .2s ease;
}

.gum::before {

    content: "";

    width: 42px;
    height: 42px;

    border-radius: 50%;

    background:
        radial-gradient(
            circle at 30% 25%,
            rgba(255,255,255,.95),
            var(--gum-light) 32%,
            var(--gum-color) 72%
        );

    border:
        2px solid rgba(255,255,255,.65);

    box-shadow:
        inset 5px 6px 8px rgba(255,255,255,.45),
        0 6px 10px rgba(100,70,60,.14);

    transition:
        transform .2s ease,
        box-shadow .2s ease;
}

.gum::after {

    content: attr(data-name);

    position: absolute;

    left: 50%;
    bottom: -2px;

    transform:
        translateX(-50%);

    white-space: nowrap;

    font-family: "Offside", sans-serif;

    font-size: 8px;

    color: #F87670;

    opacity: .9;
}

.gum:hover {
    transform: translateY(-5px);
}

.gum:hover::before {

    transform:
        scale(1.1);

    box-shadow:
        inset 5px 6px 8px rgba(255,255,255,.5),
        0 9px 15px rgba(100,70,60,.18);
}

.gum.selected::before {

    transform: scale(1.13);

    box-shadow:
        0 0 0 4px rgba(248,118,112,.16),
        inset 5px 6px 8px rgba(255,255,255,.5),
        0 8px 14px rgba(100,70,60,.18);
}

/* =========================================================
   GLASS DOORS
========================================================= */

.glass-door {

    position: absolute;

    top: 0;

    width: 50%;
    height: 100%;

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.38),
            rgba(255,255,255,.10)
        );

    backdrop-filter: blur(2px);

    border:
        2px solid rgba(255,255,255,.65);

    transition:
        transform .55s cubic-bezier(
            .68,
            -.25,
            .25,
            1.25
        );

    z-index: 20;

    pointer-events: none;
}

#glassDoorLeft {
    left: 0;
}

#glassDoorRight {
    right: 0;
}

#gumCabinet.door-open
#glassDoorLeft {

    transform:
        translateX(-104%);
}

#gumCabinet.door-open
#glassDoorRight {

    transform:
        translateX(104%);
}

/* =========================================================
   DOOR HANDLES
========================================================= */

.door-handle {

    position: absolute;

    top: 50%;

    width: 5px;
    height: 30px;

    transform:
        translateY(-50%);

    border-radius: 10px;

    background:
        rgba(248,118,112,.55);

    box-shadow:
        0 2px 5px rgba(100,60,60,.12);
}

#glassDoorLeft .door-handle {
    right: 10px;
}

#glassDoorRight .door-handle {
    left: 10px;
}

/* =========================================================
   SHELF BASE
========================================================= */

#gumShelf::after {

    content: "";

    position: absolute;

    left: 0;
    right: 0;

    bottom: -5px;

    height: 9px;

    border-radius: 10px;

    background:
        rgba(255,255,255,.55);

    box-shadow:
        0 4px 7px rgba(100,70,60,.1);

    pointer-events: none;
}

/* =========================================================
   MESSAGE + SHARE + MUSIC BUTTONS
========================================================= */

#messageFloatButton,
#shareButton,
#musicToggleButton {

    position: absolute;

    top: 82px;

    width: 48px;
    height: 48px;

    border:
        3px solid rgba(255,255,255,.75);

    border-radius: 14px;

    background: #F87670;

    color: white;

    display: flex;

    align-items: center;
    justify-content: center;

    cursor: pointer;

    box-shadow:
        0 8px 18px rgba(120,80,70,.18),
        inset 0 2px 4px rgba(255,255,255,.35);

    z-index: 100;

    transition:
        transform .2s ease,
        box-shadow .2s ease,
        background .2s ease;
}

#messageFloatButton {

    left:
        calc(
            50%
            -
            min(770px, 84vw) / 2
            -
            62px
        );
}

#shareButton {

    right:
        calc(
            50%
            -
            min(770px, 84vw) / 2
            -
            62px
        );
}

#musicToggleButton {

    right:
        calc(
            50%
            -
            min(770px, 84vw) / 2
            -
            122px
        );
    font-size: 20px;
}

#musicToggleButton.muted {
    background: #d4a5a3;
}

#messageFloatButton:hover,
#shareButton:hover,
#musicToggleButton:hover {

    transform:
        translateY(-3px);

    box-shadow:
        0 12px 24px rgba(120,80,70,.22),
        inset 0 2px 4px rgba(255,255,255,.35);
}

#messageFloatButton:active,
#shareButton:active,
#musicToggleButton:active {

    transform:
        scale(.94);
}

#messageFloatButton {

    font-size: 22px;
}

#shareButton {

    font-size: 20px;
}


/* =========================================================
   MAIN STAGE
========================================================= */

#stage {
    position: absolute;

    left: 50%;
    top: 45%;

    transform: translate(-50%, -50%);

    width: min(600px, 70vw);
    height: min(500px, 60vh);

    z-index: 30;

    pointer-events: none;
}


/* =========================================================
   CHARACTER WRAPPER
========================================================= */

#characterWrapper {
    position: absolute;

    left: 50%;
    top: 50%;

    /* The wrapper is the single, shared center reference. */


    transform: translate(-50%, -50%);

    width: 100%;
    height: 100%;

    display: flex;
    align-items: center;
    justify-content: center;

    pointer-events: none;
}


/* =========================================================
   CHARACTER
========================================================= */

#character {
    position: absolute;

    left: 50%;
    top: 50%;

    width: 330px;
    height: 440px;

    /* EXACT CENTER ANCHOR:
       every character is positioned from the same
       center point between the navigation arrows. */
    transform: translate(-50%, -50%);

    display: flex;

    align-items: center;
    justify-content: center;

    pointer-events: auto;

    cursor: pointer;

    transform-origin: center center;

    transition:
        transform .35s ease;
        
    touch-action: none;
    -webkit-touch-callout: none;
}


/* =========================================================
   CHARACTER IMAGE
========================================================= */

#characterImage {
    width: auto;

    height: min(390px, 52vh);

    /* Keep the visible character centered inside its anchor. */
    margin: 0 auto;
    object-position: 50% 50%;

    max-width: 310px;

    object-fit: contain;

    display: block;

    user-select: none;

    -webkit-user-drag: none;

    pointer-events: none;

    filter:
        drop-shadow(
            0 12px 12px rgba(100, 70, 70, .13)
        );
}

/* =========================================================
   BUBBLE
========================================================= */

#bubble {

    position: absolute;

    left: 50%;
    top: 20px;

    width: 140px;
    height: 140px;

    transform:
        translateX(-50%)
        scale(.25);

    border-radius: 50%;

    background:
        radial-gradient(
            circle at 28% 23%,
            rgba(255,255,255,.95),
            rgba(255,255,255,.62) 13%,
            rgba(248,118,112,.28) 42%,
            rgba(248,118,112,.12) 72%,
            rgba(255,255,255,.18)
        );

    border:
        2px solid rgba(255,255,255,.72);

    box-shadow:
        inset 8px 8px 15px rgba(255,255,255,.42),
        inset -8px -8px 15px rgba(248,118,112,.08),
        0 10px 22px rgba(100,70,70,.12);

    display: flex;

    align-items: center;
    justify-content: center;

    opacity: .95;

    pointer-events: auto;

    cursor: pointer;

    transition:
        transform .12s ease,
        opacity .15s ease;
}

#bubble::before {

    content: "";

    position: absolute;

    width: 18px;
    height: 9px;

    left: 28px;
    top: 22px;

    border-radius: 50%;

    background:
        rgba(255,255,255,.75);

    transform:
        rotate(-20deg);

    filter:
        blur(.5px);
}

#bubbleText {
    color: #000000;
    font-family: "Offside", sans-serif;
    font-size: 10px;
    font-weight: 600;
    text-align: center;

    display: flex;
    align-items: center;
    justify-content: center;

    width: 100%;
    height: 100%;

    padding: 12px;
    line-height: 1.35;

    text-shadow: none;
}

#mouthGum {
    position: absolute;

    width: 28px;
    height: 20px;

    border-radius: 50%;

    background: #ff5796;

    box-shadow:
        inset 2px 2px 4px rgba(255,255,255,.4),
        0 0 10px rgba(0,0,0,.08);

    pointer-events: none;

    z-index: 2;
}

/* =========================================================
   BUBBLE SPLATS
========================================================= */

.bubble-splat {
    position: absolute;
    width: 10px;
    height: 10px;
    border-radius: 50%;

    pointer-events: none;
    z-index: 1000;

    opacity: 0;
    transform: translate(-50%, -50%) scale(.2);
}


/* little stretched gum pieces */

.bubble-splat:nth-child(1) {
    width: 13px;
    height: 8px;
}

.bubble-splat:nth-child(2) {
    width: 8px;
    height: 13px;
}

.bubble-splat:nth-child(3) {
    width: 6px;
    height: 6px;
}

.bubble-splat:nth-child(4) {
    width: 11px;
    height: 7px;
}

.bubble-splat:nth-child(5) {
    width: 7px;
    height: 11px;
}

.bubble-splat:nth-child(6) {
    width: 5px;
    height: 5px;
}


/* =========================================================
   GUM STUCK TO FACE
========================================================= */

.sticky-gum {
    position: absolute;

    width: 25px;
    height: 22px;

    border-radius: 52% 48% 45% 55%;

    pointer-events: auto;

    z-index: 1001;

    cursor: pointer;

    transform-origin: center center;
}

/* tiny highlight */
.sticky-gum::after {
    content: "";

    position: absolute;

    width: 6px;
    height: 4px;

    left: 6px;
    top: 5px;

    border-radius: 50%;

    background: rgba(255,255,255,.7);

    transform: rotate(-15deg);
}

/* =========================================================
   CHARACTER INFO
========================================================= */

#characterInfo {

    position: fixed;

    left: 50%;

    bottom: -160px;

    transform:
        translateX(-50%);

    text-align: center;

    white-space: nowrap;

    pointer-events: none;
}

#characterName {

    font-family: "Offside", sans-serif;

    font-size: 22px;

    color: #000000;

    letter-spacing: 1px;
}

#characterPersonality {

    margin-top: 3px;

    font-family: "Offside", sans-serif;

    font-size: 16px;

    color: rgba(119, 0, 93, 0.72);

    letter-spacing: .7px;
}

#characterInfo::before {
    content: "";
    position: absolute;
    left: 50%;
    top: -8px;
    width: 110px;
    height: 2px;
    transform: translateX(-50%);
    background: rgba(255,255,255,.9);
    border-radius: 99px;
}

/* =========================================================
   CHARACTER NAVIGATION
========================================================= */

#previousCharacter,
#nextCharacter {

    position: absolute;

    top: 50%;

    width: 38px;
    height: 38px;

    transform:
        translateY(-50%);

    border:
        2px solid rgba(255,255,255,.7);

    border-radius: 50%;

    background:
        rgba(255,255,255,.45);

    color: #F87670;

    font-family: "Offside", sans-serif;

    font-size: 16px;

    cursor: pointer;

    pointer-events: auto;

    z-index: 50;

    box-shadow:
        0 5px 12px rgba(100,70,70,.1);

    transition:
        transform .2s ease,
        background .2s ease;
}

#previousCharacter {
    left: 5px;
}

#nextCharacter {
    right: 5px;
}

#previousCharacter:hover,
#nextCharacter:hover {

    background:
        rgba(255,255,255,.7);

    transform:
        translateY(-50%)
        scale(1.08);
}

/* =========================================================
   MESSAGE PANEL
========================================================= */

#messagePanel {

    position: fixed;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%);

    width:
        min(430px, 88vw);

    max-height:
        82vh;

    overflow-y: auto;

    padding: 26px;

    border-radius: 22px;

    background:
        rgba(255, 250, 252, 0.96);

    border:
        2px solid rgba(255, 255, 255, 0.95);

    box-shadow:
        0 20px 55px rgba(90, 60, 60, 0.18);

    z-index: 1000;

    backdrop-filter:
        blur(14px) saturate(120%);

    font-family:
        "Offside", sans-serif;

    color:
        #4d3b39;

    transition:
        opacity .2s ease,
        transform .2s ease;
}

#messagePanel.hidden-panel {

    opacity: 0;

    pointer-events: none;

    transform:
        translate(-50%, -47%)
        scale(.96);
}


/* =========================================================
   TITLE
========================================================= */

#panelTitle {

    color: #F87670;

    font-family:

    min-height: 84px;

    padding: 8px;

        box-shadow .2s ease,
        filter .2s ease;

    overflow: hidden;

    font-family:

}

.message-gum::before {

    content: "";

    position: absolute;

    top: 0;
    bottom: 0;
    left: 0;

    width: 9px;

    background:
        repeating-linear-gradient(
            45deg,
            rgba(255,255,255,.32) 0px,
            rgba(255,255,255,.32) 4px,
            transparent 4px,
            transparent 8px

    pointer-events: none;
}

.message-gum:hover {

/* =========================================================
   AUDIO CONFIG
========================================================= */

const doorSound = new Audio('door-open.wav');
const doorCloseSound = new Audio('door-close.wav');
const selectSound = new Audio('button.mp3');
const blowSound = new Audio('blowing.mp3');
const popSound = new Audio('pop.wav');

blowSound.loop = true;

/* =========================================================
   BACKGROUND MUSIC CONFIG & CONTROL
========================================================= */

const bgMusic = document.getElementById("bgMusic");
const musicToggleButton = document.getElementById("musicToggleButton");

bgMusic.volume = 0.4; // Comfortable background volume
let isMusicPlaying = false;

musicToggleButton.addEventListener("click", function() {
    if (isMusicPlaying) {
        bgMusic.pause();
        musicToggleButton.textContent = "🔇";
        musicToggleButton.classList.add("muted");
        isMusicPlaying = false;
    } else {
        bgMusic.play().then(() => {
            musicToggleButton.textContent = "🎵";

/* =========================================================

========================================================= */

    characterPersonality.textContent =
        c.personality;

/* =========================================================
   CHARACTER NAVIGATION
========================================================= */

function changeCharacter(direction) {

    currentCharacter +=
        direction;

    if (
        currentCharacter <
        0
    ) {

        currentCharacter =
            characters.length - 1;

    }

    if (
        currentCharacter >=
        characters.length
    ) {

        currentCharacter = 0;

    }

    renderCharacter();

}

    if (!gums[gumName]) {

/* =========================================================
   BUBBLE
========================================================= */

function showMouthGum() {

    bubble.style.display = "flex";
    bubble.style.opacity = ".95";

    bubbleSize = 25;

    updateBubble();
}


function hideBubble() {

    bubble.style.opacity = "0";
    bubble.style.display = "none";

    bubbleSize = 25;
}


function updateBubble() {

    const gum = gums[selectedGum];

    if (!gum) {
        return;
    }

    if (!bubbleAvailable) {

        bubble.style.display = "none";

        return;
    }

    bubble.style.display = "flex";
    bubble.style.opacity = ".95";

    const scale =
        bubbleSize / 140;

    bubble.style.transform = `
        translateX(-50%)
        scale(${Math.max(.25, scale)})
    `;

    bubble.style.background = `
        radial-gradient(
            circle at 28% 23%,
            rgba(255,255,255,.98),
            rgba(255,255,255,.8) 12%,
            ${gum.light}DD 35%,
            ${gum.color}CC 68%,
            ${gum.color}AA 100%
        )
    `;

    bubble.style.border = `
        3px solid ${gum.light}
    `;

    bubble.style.boxShadow = `
        inset 8px 8px 15px rgba(255,255,255,.55),
        inset -8px -8px 15px ${gum.color}55,
        0 10px 24px ${gum.color}55
    `;

    bubbleText.textContent =
        messages[selectedGum] || "";
}


/* =========================================================
   START BLOWING
========================================================= */

function startBlowing(event) {

    if (
        event.button !== undefined &&
        event.button !== 0
    ) {
        return;
    }

    if (!bubbleAvailable || popping) {
        return;
    }

    event.preventDefault();

    blowing = true;
    
    blowSound.play();

    bubble.style.display = "flex";
    bubble.style.opacity = ".95";

    if (bubbleSize <= 25) {
        bubbleSize = 25;
    }

    updateBubble();

    if (blowTimer) {
        clearInterval(blowTimer);
    }

    blowTimer = setInterval(function() {

        if (!blowing || !bubbleAvailable || popping) {
            return;
        }

        const gum = gums[selectedGum];

        bubbleSize += gum.speed;

        if (bubbleSize >= gum.max) {

            bubbleSize = gum.max;

            updateBubble();

            blowing = false;

            if (blowTimer) {
                clearInterval(blowTimer);
                blowTimer = null;
            }

            setTimeout(function() {

                if (bubbleAvailable) {
                    popBubble();
                }

            }, 120);

            return;
        }

        updateBubble();

    }, 35);
}


/* =========================================================
   STOP BLOWING
========================================================= */

function stopBlowing() {

    blowing = false;
    
    blowSound.pause();
    blowSound.currentTime = 0;

    if (blowTimer) {

        clearInterval(
            blowTimer
        );

        blowTimer = null;
    }

}

/* =========================================================
   POP BUBBLE
========================================================= */

function popBubble() {

    if (!bubbleAvailable || popping) return;
    if (bubbleSize < 45) return;

    popping = true;
    blowing = false;

    blowSound.pause();
    blowSound.currentTime = 0;
    popSound.currentTime = 0;
    popSound.play();

    if (blowTimer) {
        clearInterval(blowTimer);
        blowTimer = null;
    }

    bubble.getAnimations().forEach(animation => {
        animation.cancel();
    });

    const currentScale =
        Math.max(.25, bubbleSize / 140);

    const gum = gums[selectedGum];

    const splats = [];

    for (let i = 0; i < 6; i++) {

        const splat = document.createElement("div");

        splat.className = "bubble-splat";

        splat.style.background = gum.color;
        splat.style.boxShadow = `
            inset 2px 2px 4px rgba(255,255,255,.65),
            0 3px 8px ${gum.color}66
        `;

        splat.style.left = bubble.style.left;
        splat.style.top = bubble.style.top;

        character.appendChild(splat);

        splats.push(splat);
    }

    bubble.animate(
        [
            {
                transform:
                    `translateX(-50%) scale(${currentScale})`,
                opacity: .95
            },
            {
                transform:
                    `translateX(-50%) scale(${currentScale * 1.08}, ${currentScale * .92})`,
                opacity: 1,
                offset: .25
            },
            {
                transform:
                    `translateX(-50%) scale(${currentScale * .94}, ${currentScale * 1.08})`,
                opacity: 1,
                offset: .45
            },
            {
                transform:
                    `translateX(-50%) scale(${currentScale * 1.16})`,
                opacity: 1,
                offset: .72
            },
            {
                transform:
                    `translateX(-50%) scale(${currentScale * 1.28})`,
                opacity: .9,
                offset: .86
            },
            {
                transform:
                    `translateX(-50%) scale(0)`,
                opacity: 0,
                offset: 1
            }
        ],
        {
            duration: 300,
            easing: "cubic-bezier(.15,.9,.25,1)",
            fill: "forwards"
        }
    );

    const directions = [
        [-48, -38],
        [ 45, -35],
        [-58,   2],
        [ 55,  12],
        [-32,  48],
        [ 38,  52]
    ];

    splats.forEach((splat, index) => {

        const [dx, dy] = directions[index];

        splat.animate(
            [
                {
                    transform:
                        "translate(-50%, -50%) scale(.2) rotate(0deg)",
                    opacity: 0
                },
                {
                    transform:
                        `translate(calc(-50% + ${dx * .45}px), calc(-50% + ${dy * .45}px))
                         scale(1.15)
                         rotate(${index % 2 ? 25 : -25}deg)`,
                    opacity: 1,
                    offset: .28
                },
                {
                    transform:
                        `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))
                         scale(.65)
                         rotate(${index % 2 ? 70 : -70}deg)`,
                    opacity: .8,
                    offset: .7
                },
                {
                    transform:
                        `translate(calc(-50% + ${dx * 1.2}px), calc(-50% + ${dy * 1.2}px))
                         scale(.15)
                         rotate(${index % 2 ? 100 : -100}deg)`,
                    opacity: 0
                }
            ],
            {
                duration: 420,
                delay: 15 + index * 8,
                easing: "cubic-bezier(.15,.7,.25,1)",
                fill: "forwards"
            }
        );
    });

    setTimeout(() => {

        bubbleAvailable = false;
        popping = false;
        bubbleSize = 25;

        bubble.style.display = "none";
        bubble.style.opacity = "0";

        bubble.getAnimations().forEach(animation => {
            animation.cancel();
        });

        splats.forEach(splat => {
            splat.getAnimations().forEach(animation => {
                animation.cancel();
            });

            splat.remove();
        });

    }, 450);
}

 const data = {

========================================================= */

/* =========================================================
   SHARED VIEW
========================================================= */

function loadSharedView() {

    if (
        !location.hash ||
        location.hash.length < 2
    ) {

        return;

    }

    try {

        const encoded =
            location.hash.substring(1);

        const data =
            JSON.parse(
                decodeURIComponent(
                    atob(encoded)
                )
            );

        if (data.messages) {

            messages = {
                ...messages,
                ...data.messages
            };

        }

        if (
            typeof data.character === "number"
        ) {

            currentCharacter =
                Math.max(
                    0,
                    Math.min(
                        characters.length - 1,
                        data.character
                    )
                );

        }

        messagePanel.style.display =
            "none";

        messageFloatButton.style.display =
            "none";

        shareButton.style.display =
            "none";

        const shelfArea =
            document.getElementById(
                "shelfArea"
            );

        shelfArea.style.display =
            "block";

        if (data.selectedGum && gums[data.selectedGum]) {

            selectedGum =
                data.selectedGum;

        }

        bubbleAvailable = true;
        popping = false;
        blowing = false;
        bubbleSize = 25;

        renderCharacter();

        document
            .querySelectorAll(".gum")
            .forEach(function(button) {

                button.classList.toggle(
                    "selected",
                    button.dataset.gum === selectedGum
                );

            });

        doorOpen = false;

        gumCabinet.classList.remove(
            "door-open"
        );

    }
    catch (error) {

        console.warn(
            "Could not load shared bubblegum:",
            error
        );

    }

}
