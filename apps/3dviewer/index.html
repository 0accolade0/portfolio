<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./3dviewer.css">
</head>
<body>

<main id="holo-lab">

    <header id="holo-header">
        <button id="holo-close" type="button">×</button>
    </header>

    <section id="category-view" class="view active">

        <div class="section-heading">
            <h1>My 3D Models</h1>
            <p>Select a category to view models.</p>
        </div>

        <div id="category-grid" class="category-grid"></div>

    </section>

    <section id="model-view" class="view">

        <button
            id="back-to-categories"
            class="holo-back"
            type="button"
        >
            ←
        </button>

        <div class="model-view-content">

            <div id="model-stage" class="model-stage">
                <div
                    id="model-container"
                    class="model-container"
                ></div>
            </div>

            <div id="model-info" class="model-info">
                <div
                    id="current-category"
                    class="model-category"
                >
                    CATEGORY
                </div>

                <div
                    id="current-model-name"
                    class="model-name"
                >
                    MODEL
                </div>

                <div
                    id="current-model-status"
                    class="model-status"
                >
                    READY
                </div>
            </div>

            <div
                id="model-selector"
                class="model-selector"
            ></div>

        </div>

    </section>

</main>

<script type="importmap">
{
    "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
}
</script>

<script type="module" src="./3dviewer.js"></script>


</body>
</html>
